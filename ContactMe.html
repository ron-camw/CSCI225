<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Contact Me - Camron Williams</title>
    </head>

    <body>
        <h1>Contact me</h1>

        <h2>Video</h2>
        <iframe width="719" height="337" 
        src="https://www.youtube.com/embed/NSAOrGb9orM" 
        title="Nature Video 30 Seconds|WhatsApp Status Video|Nature Background Videos" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
        </iframe>

        <h2>Feedback</h2>

        <form name="feedback">
        
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="anonymous" required>
        
            <br><br>
        
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="anonymous" required>

            <br><br>

            <label for="mail">Email:</label>
            <input type="email" id="mail" name="mail"
                placeholder="name@domain.com">

            <br><br>

            <p>Would you recommend this website?</p>

            <input type="radio" id="yes"
                name="recommend" value="yes">
            <label for="yes">Yes</label>

            <input type="radio" id="no"
                name="recommend" value="no">
            <label for="no">No</label>

            <br><br>

<label for="favorite-site">Favorite Website:</label>
<select id="favorite-site" name="favorite-site">
    <option value="google">Google</option>
    <option value="youtube">YouTube</option>
    <option value="facebook">Facebook</option>
    <option value="twitter">Twitter</option>
</select>

<br><br>

<label for="rating">Rate this website from 1 to 10:</label>
<input type="range" id="rating" name="rating" min="1" max="10">


<br><br>

<label for="comment">Additional Comments:</label>
<br>
<textarea id="comment" name="comment" rows="5" cols="40"></textarea>

<br><br>

<br><br>

<label for="visit-date">Date You Visited This Website:</label>
<input type="date" id="visit-date" name="visit-date">

<br><br>

<label for="favorite-color">Favorite Color:</label>
<input type="color" id="favorite-color" name="favorite-color">

<br><br>

<label for="website">Your Website:</label>
<input type="url" id="website" name="website"
    placeholder="https://example.com">

<br><br>


<input type="submit" name="submit" value="Submit Feedback">

        
        </form>

    </body>
</html>
